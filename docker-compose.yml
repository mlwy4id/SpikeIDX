# SpikeIDX on cloud Postgres (Supabase/Neon). No local db service.
# Copy to .env and fill DATABASE_URL from your provider dashboard.
services:
  api:
    build: .
    command: ["./api"]
    env_file: [.env]
    ports: ["8080:8080"]

  worker:
    build: .
    command: ["./worker"]
    env_file: [.env]
    # Single-run EOD; schedule externally, e.g. cron:
    # 30 16 * * 1-5 TZ=Asia/Jakarta /path/to/worker
